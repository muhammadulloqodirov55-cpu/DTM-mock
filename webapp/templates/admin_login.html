<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — DTM Mock</title>
<style>
:root{--ink:#0a1020;--muted:#59667a;--acc:#1469ff;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:var(--ink);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden;position:relative}
body::before{content:"DTM";position:fixed;z-index:0;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(300px,42vw,620px);
  line-height:.73;letter-spacing:-.10em;color:#77849a;opacity:.55;pointer-events:none;user-select:none}
body::after{content:"";position:fixed;z-index:0;left:-570px;top:-470px;width:860px;height:860px;
  border:1px solid rgba(26,79,214,.20);border-radius:50%;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.card{position:relative;z-index:2;width:min(440px,100%);padding:44px 40px 36px;border-radius:20px;
  background:rgba(255,255,255,.14);border:1px solid rgba(145,164,190,.32);
  -webkit-backdrop-filter:blur(5px) saturate(108%) brightness(1.03);
  backdrop-filter:blur(5px) saturate(108%) brightness(1.03);
  box-shadow:0 34px 74px rgba(31,51,80,.16),0 8px 24px rgba(31,51,80,.075),
    inset 0 1.5px 0 rgba(255,255,255,.94),inset 0 -1.5px 0 rgba(101,122,150,.22);
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:1px solid rgba(255,255,255,.74);
  box-shadow:inset 0 0 0 7px rgba(255,255,255,.075),inset 0 10px 22px rgba(255,255,255,.10)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:2}
.logo .m{background:var(--ink);color:#fff;font-weight:800;font-size:18px;letter-spacing:1px;padding:6px 12px;border-radius:8px}
.logo .t{font-size:10.5px;font-weight:700;letter-spacing:2.4px;color:#425372;text-transform:uppercase}
h1{margin:0 0 6px;font-size:32px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:2}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.55;position:relative;z-index:2}
form{position:relative;z-index:2}
label{display:block;font-size:12px;color:#425372;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:14px 0 9px}
.input-wrap{height:64px;border-radius:14px;border:1px solid rgba(143,163,190,.28);
  background:rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 7px 20px rgba(31,53,83,.04);
  transition:border-color .18s,box-shadow .18s,background .18s,transform .18s}
.input-wrap:focus-within{border-color:rgba(20,105,255,.42);background:rgba(255,255,255,.45);
  box-shadow:0 0 0 4px rgba(20,105,255,.07),inset 0 1px 0 rgba(255,255,255,.92);transform:translateY(-1px)}
input{width:100%;height:100%;border:0;outline:none;background:transparent;color:#0a0d14;
  padding:0 20px;font:inherit;font-size:22px;font-weight:500}
button{position:relative;width:100%;height:66px;margin-top:24px;border:0;border-radius:12px;cursor:pointer;overflow:hidden;
  color:#fff;font:inherit;font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(180deg,#2d7cff 0%,#1267f4 100%);
  box-shadow:0 17px 34px rgba(20,105,255,.22),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s,box-shadow .18s}
button:hover{transform:translateY(-2px);box-shadow:0 22px 40px rgba(20,105,255,.29)}
button:active{transform:translateY(0) scale(.995)}
.flash{position:relative;z-index:2;background:rgba(179,38,30,.07);border:1px solid rgba(179,38,30,.25);color:var(--err);
  padding:12px 15px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:500;animation:rise .3s ease both}
.note{margin-top:20px;padding-top:16px;border-top:1px solid rgba(132,154,184,.26);color:var(--muted);
  font-size:12px;line-height:1.6;position:relative;z-index:2}
code{background:rgba(20,105,255,.07);color:#0b56d7;padding:1px 6px;border-radius:5px;font-size:12px}
@media (max-width:520px){body{overflow:auto}.card{padding:34px 22px 26px}h1{font-size:27px}input{font-size:19px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="m">DTM</span><span class="t">Admin panel</span></div>
  <h1>Kirish</h1>
  <p class="sub">Boshqaruv sahifalari parol bilan himoyalangan.</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Admin parol</label>
    <div class="input-wrap">
      <input type="password" name="password" required autofocus autocomplete="current-password">
    </div>
    <button type="submit">Kirish</button>
  </form>
  <div class="note">Parol <code>data/admin_parol.txt</code> faylida (server egasi ko'radi) yoki
  <code>DTM_ADMIN_PASSWORD</code> muhit o'zgaruvchisida.</div>
</div>
</body>
</html>
