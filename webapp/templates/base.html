<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DTM Mock{% endblock %}</title>
<style>
:root{
  --ink:#111111; --paper:#f7f6f2; --card:#ffffff; --line:#e3e1da; --txt:#111111; --muted:#6b6f76;
  --acc:#1a4fd6; --acc-soft:#e8eefc; --ok:#1a4fd6; --ok-soft:#e8eefc;
  --err:#b3261e; --err-soft:#faeae8; --warn:#8a5a00; --warn-soft:#fdf3e0;
  --radius:9px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--txt);font-size:15px;line-height:1.5;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='460'><defs><pattern id='p' width='9' height='9' patternTransform='rotate(45)' patternUnits='userSpaceOnUse'><line x1='0' y1='0' x2='0' y2='9' stroke='%23111111' stroke-width='2.4'/></pattern></defs><text x='500' y='320' text-anchor='middle' font-family='Georgia, serif' font-size='330' font-weight='bold' letter-spacing='26' fill='url(%23p)' stroke='%23111111' stroke-width='2.5' opacity='0.04'>DTM</text></svg>"),
    repeating-linear-gradient(0deg, rgba(17,17,17,.02) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(17,17,17,.02) 0 1px, transparent 1px 44px);
  background-repeat:no-repeat,repeat,repeat;background-position:center center,0 0,0 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{background:var(--ink);color:#fff;padding:0 20px;display:flex;gap:2px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .brand{font-weight:800;font-size:17px;color:#fff;text-decoration:none;padding:15px 14px 15px 0;letter-spacing:1px}
header .brand span{color:#8fa8ee}
header a.nav{color:#9a9da3;text-decoration:none;padding:16px 13px;border-bottom:2.5px solid transparent;font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase;transition:color .15s}
header a.nav:hover{color:#fff}
header a.nav.active{color:#fff;border-bottom-color:var(--acc)}
main{max-width:1150px;margin:24px auto;padding:0 16px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;animation:rise .4s ease both}
.card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}
h2{margin:0 0 6px;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.hint{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;background:transparent}
tr:last-child td{border-bottom:0}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 18px;cursor:pointer;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transition:transform .13s,box-shadow .13s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(26,79,214,.3)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.btn.sec:hover{box-shadow:0 4px 12px rgba(17,17,17,.15)}
.btn.danger{background:var(--card);color:var(--err);border:1px solid var(--err)}
.btn.danger:hover{box-shadow:0 4px 12px rgba(179,38,30,.2)}
input[type=text],input[type=number],select,textarea{padding:8px 11px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fff;color:var(--txt);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,79,214,.13)}
input[type=file]{font-size:14px}
.flash{padding:11px 14px;border-radius:8px;margin-bottom:12px;font-weight:500;animation:rise .3s ease both}
.flash.ok{background:var(--acc-soft);color:var(--acc)}
.flash.err{background:var(--err-soft);color:var(--err)}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tag.flag{background:var(--warn-soft);color:var(--warn)}
.tag.nokey{background:var(--err-soft);color:var(--err)}
.tag.ok{background:var(--ink);color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>div{display:flex;flex-direction:column;gap:5px}
label{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.big{font-size:34px;font-weight:800;color:var(--ink);line-height:1.1}
code{background:#efede7;padding:1px 6px;border-radius:4px;font-size:13px}
</style>
<script>
/* Dialogsiz ikki bosqichli tasdiqlash: birinchi bosishda tugma "Aniq o'chirilsinmi?"
   deb so'raydi, 3 soniya ichida ikkinchi bosish amalni bajaradi. window.confirm()
   ba'zi ko'rish muhitlarida (embed brauzerlar) avtomatik rad etiladi — bunda emas. */
function confirm2(form){
  var btn = form.querySelector('button');
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1';
  btn.dataset.orig = btn.textContent;
  btn.textContent = "Aniq o'chirilsinmi?";
  setTimeout(function(){ btn.textContent = btn.dataset.orig; delete btn.dataset.armed; }, 3000);
  return false;
}
</script>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('exams_page') }}">DTM <span>MOCK</span></a>
  <a class="nav {% if request.endpoint in ('exams_page', 'exam_manage') %}active{% endif %}" href="{{ url_for('exams_page') }}">Imtihonlar</a>
  <a class="nav" href="{{ url_for('home') }}" style="margin-left:auto">O'quvchi sahifasi ↗</a>
  {% if session.get('admin') %}
  <form method="post" action="{{ url_for('admin_logout') }}" style="margin:0">
    <button class="nav" type="submit" style="background:none;border:0;border-bottom:2.5px solid transparent;cursor:pointer;font-family:inherit;padding:16px 13px;color:#9a9da3;font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase">Chiqish</button>
  </form>
  {% endif %}
</header>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
