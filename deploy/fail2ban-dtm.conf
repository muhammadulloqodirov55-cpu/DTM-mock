# DTM Mock — fail2ban: ilova aniqlagan buzuqlarni FIREWALL darajasida bloklash
# (ilova ichidagi 15-daqiqalik ban ustiga — tarmoq darajasida uzilish qo'shiladi)
#
# O'rnatish:
#   sudo apt install fail2ban
#   sudo cp deploy/fail2ban-dtm.conf /etc/fail2ban/filter.d/dtm-mock.conf   (FILTER qismini)
#   /etc/fail2ban/jail.local ga JAIL qismini qo'shing (yo'lni moslang)
#   sudo systemctl restart fail2ban
#   Holat: sudo fail2ban-client status dtm-mock

# ============ FILTER (/etc/fail2ban/filter.d/dtm-mock.conf) ============
[Definition]
failregex = ^.* (VIOLATION|LOGIN-FAIL|CSRF-BLOCK).* ip=<HOST>
ignoreregex =

# ============ JAIL (/etc/fail2ban/jail.local ga qo'shing) ============
# [dtm-mock]
# enabled  = true
# filter   = dtm-mock
# logpath  = /home/muhammadullo/Desktop/dtm_omr/data/security.log
# maxretry = 15
# findtime = 300
# bantime  = 3600
# action   = iptables-allports[name=dtm-mock]
