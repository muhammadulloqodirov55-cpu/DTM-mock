# DTM Mock — nginx reverse proxy (L7 himoya qatlami)
# O'rnatish: sudo cp deploy/nginx-dtm.conf /etc/nginx/sites-available/dtm
#            sudo ln -s /etc/nginx/sites-available/dtm /etc/nginx/sites-enabled/
#            sudo certbot --nginx -d sizning-domen.uz     (HTTPS uchun)
#            sudo nginx -t && sudo systemctl reload nginx
# Ilovani DTM_BEHIND_PROXY=1 DTM_HTTPS=1 bilan ishga tushiring.

# so'rov tezligi zonalari (IP boshiga)
limit_req_zone  $binary_remote_addr zone=dtm_gen:20m   rate=10r/s;   # umumiy
limit_req_zone  $binary_remote_addr zone=dtm_post:10m  rate=3r/s;    # POST og'irroq
limit_conn_zone $binary_remote_addr zone=dtm_conn:20m;               # bir IP ulanishlari

server {
    listen 80;
    server_name _;            # o'z domeningizni yozing

    # --- DDoS bardoshlilik ---
    limit_conn dtm_conn 20;                  # bir IP maksimum 20 ulanish
    client_body_timeout 12s;                 # slowloris
    client_header_timeout 12s;
    send_timeout 20s;
    keepalive_timeout 30s;
    client_max_body_size 70m;
    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    # --- proxy ---
    location / {
        limit_req zone=dtm_gen burst=25 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # POST endpointlarga qattiqroq chegara
    location ~ ^/(exam/start|admin/login)$ {
        limit_req zone=dtm_post burst=6 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # statika — brauzer keshi (proxy_cache_valid ishlashi uchun proxy_cache zonasi
    # kerak bo'lardi; brauzer darajasidagi immutable kesh bu o'lchamda yetarli)
    location /static/ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
